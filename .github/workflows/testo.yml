on:
  pull_request: null
  push:
    branches:
      - '1.x'

name: testo

jobs:
  testo:
    uses: spiral/gh-actions/.github/workflows/testo.yml@master
    with:
      os: >-
        ['ubuntu-latest']
      dependencies: >-
        ['lowest', 'highest']
      ini-values: memory_limit=-1, zend.assertions=1
      codecov: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
